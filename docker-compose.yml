services:
  app:
    build:
      context: .
      dockerfile: .dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-notification_preferences}:${POSTGRES_PASSWORD:-notification_preferences}@postgres:5432/${POSTGRES_DB:-notification_preferences}
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notification_preferences}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notification_preferences}
      POSTGRES_DB: ${POSTGRES_DB:-notification_preferences}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
